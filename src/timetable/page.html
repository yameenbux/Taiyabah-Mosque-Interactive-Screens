<!DOCTYPE html>
<!--
  Taiyabah Masjid: Salah times, for the TVs in the prayer hall and downstairs.
  Bolton Central Islamic Society · Registered charity 1041569
  31a Draycott Street, Bolton BL1 8HD

  Built by build.py from src/timetable/ and src/shared/. Fonts, logo and every
  year of prayer times are inside this file: once loaded it needs no network.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3C0B2A">
<title>Taiyabah Masjid · Salah times</title>
<style>{{CSS}}</style>
</head>
<body class="{{BODYCLASS}}">
<div class="ground"></div>
<div class="stage">
 <div id="content">
  <div class="star" data-deco><svg viewBox="0 0 100 100"><polygon fill="currentColor" points="50,2 57.3,32.4 83.9,16.1 67.6,42.7 98,50 67.6,57.3 83.9,83.9 57.3,67.6 50,98 42.7,67.6 16.1,83.9 32.4,57.3 2,50 32.4,42.7 16.1,16.1 42.7,32.4"/></svg></div>
  <div id="clock"></div>
  <div class="hdr">{{LOGO}}<div class="dates"><span id="greg"></span><span id="hijri"></span></div></div>
  <div id="arcwrap"><svg id="arc"></svg><div id="next" class="pill"></div></div>
  <div id="cards"></div>
  <div id="nodata" hidden>Prayer times for this date are not loaded. Please use the printed timetable.</div>
  <div class="bar" id="tbar"><span id="jum"></span><span id="sun" class="mut"></span></div>
 </div>
</div>
<script>{{DATA}}</script>
<script>{{JS}}</script>
</body>
</html>
