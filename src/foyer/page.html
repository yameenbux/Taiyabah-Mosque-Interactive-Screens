<!DOCTYPE html>
<!--
  Taiyabah Masjid: the foyer screen. The New Build appeal, and the Ramadan
  and Eid greetings on their dates.
  Bolton Central Islamic Society · Registered charity 1041569
  31a Draycott Street, Bolton BL1 8HD

  Built by build.py from src/foyer/ and src/shared/. The words come from
  foyer-content.json beside this file, re-read every ten minutes; a copy is
  built in, so the screen never goes blank if that file can't be reached.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3C0B2A">
<title>Taiyabah Masjid · Foyer</title>
<style>{{CSS}}</style>
</head>
<body class="{{BODYCLASS}}">
<div class="ground"></div>
<div class="stage">
 <div id="content">
  <div id="clock"></div>
  <div class="hdr">{{LOGO}}<div class="dates"><span id="greg"></span><span id="hijri"></span></div></div>

  <div id="newbuild">
   <div id="intro">
    <div class="eyebrow" id="nb-eyebrow"></div>
    <h1 id="phase-title"></h1>
    <div id="needs"></div>
   </div>
   <div id="progress"><div class="track"><i class="fill"></i><i class="dot"></i></div><div class="pl"><span id="pl-done"></span><span id="pl-now"></span><span id="pl-next"></span></div></div>
   <div id="give">
    <div class="qr" id="qr" data-qr></div>
    <div class="qrtxt"><div class="eyebrow">Give to the New Build</div><h2 id="qr-label"></h2><p id="qr-sub"></p></div>
   </div>
  </div>
  <div id="appbox"><div class="eyebrow" id="app-label"></div><div class="badges"><img class="badge ap" src="{{BADGE_APPLE}}" alt="Download on the App Store"><img class="badge gp" src="{{BADGE_GOOGLE}}" alt="Get it on Google Play"></div></div>

  <div id="occasion" hidden><div class="o-in" id="oin">
   <div class="o-ar ar" id="o-arabic" lang="ar" dir="rtl"></div>
   <h1 id="o-title"></h1>
   <p id="o-message"></p>
   <div class="o-day" id="oday" hidden></div>
  </div></div>

  <div id="fbar"><div class="fbox" id="next"></div><div class="fbox" id="jum"></div></div>
 </div>
</div>
<script>{{DATA}}{{CONTENT}}</script>
<script>{{JS}}</script>
</body>
</html>
